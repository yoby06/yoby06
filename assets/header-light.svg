<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Yiğit Oğul Bayarlar — Yazılım Geliştirici">
<defs>
  <linearGradient id="fadeY" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.12" stop-color="#fff" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0.12"/>
  </linearGradient>
  <radialGradient id="fadeX" cx="0.5" cy="0.62" r="0.55">
    <stop offset="0" stop-color="#fff"/>
    <stop offset="1" stop-color="#000"/>
  </radialGradient>
  <mask id="gridFadeX"><rect width="1000" height="320" fill="url(#fadeX)"/></mask>
  <mask id="gridFade"><g mask="url(#gridFadeX)"><rect y="200" width="1000" height="120" fill="url(#fadeY)"/></g></mask>

  <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
    <stop offset="0" stop-color="#1f2328"/>
    <stop offset="0.42" stop-color="#1f2328"/>
    <stop offset="0.5" stop-color="#0969da"/>
    <stop offset="0.58" stop-color="#1f2328"/>
    <stop offset="1" stop-color="#1f2328"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1000;1000" dur="7s" repeatCount="indefinite"/>
  </linearGradient>

  <linearGradient id="horizon" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="920" y2="0">
    <stop offset="0" stop-color="#0969da" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#0969da" stop-opacity="1"/>
    <stop offset="1" stop-color="#8250df" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="beamV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0969da" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#0969da" stop-opacity="1"/>
    <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" x2="1">
    <stop offset="0" stop-color="#0969da" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#0969da" stop-opacity="1"/>
    <stop offset="1" stop-color="#8250df" stop-opacity="0"/>
  </linearGradient>

  <clipPath id="reveal">
    <rect x="500.0" y="0" width="0" height="320">
      <animate attributeName="x" values="500.0;200.0" dur="1.6s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
      <animate attributeName="width" values="0;600" dur="1.6s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </rect>
  </clipPath>

  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
</defs>

<g stroke="#0969da" stroke-width="1" mask="url(#gridFade)"><line x1="500.0" y1="200" x2="-500" y2="320" /><line x1="500.0" y1="200" x2="-450" y2="320" /><line x1="500.0" y1="200" x2="-400" y2="320" /><line x1="500.0" y1="200" x2="-350" y2="320" /><line x1="500.0" y1="200" x2="-300" y2="320" /><line x1="500.0" y1="200" x2="-250" y2="320" /><line x1="500.0" y1="200" x2="-200" y2="320" /><line x1="500.0" y1="200" x2="-150" y2="320" /><line x1="500.0" y1="200" x2="-100" y2="320" /><line x1="500.0" y1="200" x2="-50" y2="320" /><line x1="500.0" y1="200" x2="0" y2="320" /><line x1="500.0" y1="200" x2="50" y2="320" /><line x1="500.0" y1="200" x2="100" y2="320" /><line x1="500.0" y1="200" x2="150" y2="320" /><line x1="500.0" y1="200" x2="200" y2="320" /><line x1="500.0" y1="200" x2="250" y2="320" /><line x1="500.0" y1="200" x2="300" y2="320" /><line x1="500.0" y1="200" x2="350" y2="320" /><line x1="500.0" y1="200" x2="400" y2="320" /><line x1="500.0" y1="200" x2="450" y2="320" /><line x1="500.0" y1="200" x2="500" y2="320" /><line x1="500.0" y1="200" x2="550" y2="320" /><line x1="500.0" y1="200" x2="600" y2="320" /><line x1="500.0" y1="200" x2="650" y2="320" /><line x1="500.0" y1="200" x2="700" y2="320" /><line x1="500.0" y1="200" x2="750" y2="320" /><line x1="500.0" y1="200" x2="800" y2="320" /><line x1="500.0" y1="200" x2="850" y2="320" /><line x1="500.0" y1="200" x2="900" y2="320" /><line x1="500.0" y1="200" x2="950" y2="320" /><line x1="500.0" y1="200" x2="1000" y2="320" /><line x1="0" x2="1000" y1="200" y2="200"><animate attributeName="y1" values="200;320" dur="6s" begin="0.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 0.45"/><animate attributeName="y2" values="200;320" dur="6s" begin="0.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 0.45"/></line><line x1="0" x2="1000" y1="200" y2="200"><animate attributeName="y1" values="200;320" dur="6s" begin="-1.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 0.45"/><animate attributeName="y2" values="200;320" dur="6s" begin="-1.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 0.45"/></line><line x1="0" x2="1000" y1="200" y2="200"><animate attributeName="y1" values="200;320" dur="6s" begin="-2.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 0.45"/><animate attributeName="y2" values="200;320" dur="6s" begin="-2.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 0.45"/></line><line x1="0" x2="1000" y1="200" y2="200"><animate attributeName="y1" values="200;320" dur="6s" begin="-3.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 0.45"/><animate attributeName="y2" values="200;320" dur="6s" begin="-3.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 0.45"/></line><line x1="0" x2="1000" y1="200" y2="200"><animate attributeName="y1" values="200;320" dur="6s" begin="-4.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 0.45"/><animate attributeName="y2" values="200;320" dur="6s" begin="-4.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 0.45"/></line><line x1="0" x2="1000" y1="200" y2="200"><animate attributeName="y1" values="200;320" dur="6s" begin="-5.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 0.45"/><animate attributeName="y2" values="200;320" dur="6s" begin="-5.00s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 0.45"/></line></g>
<circle cx="120" cy="60" r="1.2" fill="#0969da" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="4s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="210" cy="150" r="1.2" fill="#0969da" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="4s" begin="1.3s" repeatCount="indefinite"/></circle><circle cx="330" cy="40" r="1.2" fill="#0969da" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="4s" begin="2.1s" repeatCount="indefinite"/></circle><circle cx="690" cy="55" r="1.2" fill="#0969da" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="4s" begin="0.7s" repeatCount="indefinite"/></circle><circle cx="790" cy="140" r="1.2" fill="#0969da" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="4s" begin="2.6s" repeatCount="indefinite"/></circle><circle cx="880" cy="70" r="1.2" fill="#0969da" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="4s" begin="1.8s" repeatCount="indefinite"/></circle><circle cx="60" cy="170" r="1.2" fill="#0969da" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="4s" begin="3.1s" repeatCount="indefinite"/></circle><circle cx="940" cy="175" r="1.2" fill="#0969da" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="4s" begin="0.4s" repeatCount="indefinite"/></circle><circle cx="450" cy="30" r="1.2" fill="#0969da" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="4s" begin="2.9s" repeatCount="indefinite"/></circle><circle cx="560" cy="180" r="1.2" fill="#0969da" opacity="0"><animate attributeName="opacity" values="0;0.9;0" dur="4s" begin="1.1s" repeatCount="indefinite"/></circle>

<!-- horizon line -->
<line x1="500.0" x2="500.0" y1="200" y2="200" stroke="url(#horizon)" stroke-width="1.5">
  <animate attributeName="x1" values="500.0;80" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  <animate attributeName="x2" values="500.0;920" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
</line>

<!-- name -->
<g text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="300" font-size="46" letter-spacing="14">
  <text x="507.0" y="122" fill="#0969da" opacity="0" filter="url(#glow)">YİĞİT OĞUL BAYARLAR
    <animate attributeName="opacity" values="0;0.55;0.18" keyTimes="0;0.4;1" dur="2.2s" begin="0.2s" fill="freeze"/>
  </text>
  <text x="507.0" y="122" fill="url(#shine)" opacity="0">YİĞİT OĞUL BAYARLAR
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.2s" fill="freeze"/>
    <animate attributeName="letter-spacing" values="30;14" dur="1.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </text>
</g>

<!-- role -->
<g clip-path="url(#reveal)">
  <text x="503.0" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="6" fill="#59636e">YAZILIM GELİŞTİRİCİ  ·  MOBİL &amp; WEB</text>
</g>

<!-- scan beam sweeping the name -->
<g opacity="0">
  <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="5s" begin="2s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0;800" dur="5s" begin="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  <rect x="100" y="70" width="1.5" height="110" fill="url(#beamV)"/>
  <rect x="94" y="70" width="14" height="110" fill="url(#beamV)" opacity="0.25" filter="url(#glow)"/>
</g>

<g fill="none" stroke="#59636e" stroke-width="1.2" opacity="0.7"><path d="M24,42 V24 H42"/><path d="M958,24 H976 V42"/><path d="M24,278 V296 H42"/><path d="M958,296 H976 V278"/></g><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2" fill="#59636e"><text x="52" y="28">YOBY // 06</text><text x="948" y="28" text-anchor="end">39.93°N  32.86°E</text><text x="52" y="296">ANKARA · TR</text><g transform="translate(948,296)"><circle cx="-112" cy="-3.5" r="3" fill="#0969da"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle><text text-anchor="end">SYSTEM ONLINE</text></g></g>
</svg>
